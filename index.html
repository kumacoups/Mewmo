<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3d9d0"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Mewmo"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Mewmo</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai+Looped:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3d9d0;--card:#faf4d4;--in:#fffbe8;--ink:#1f3a6b;--mut:#6a6f90;--line:#eadfb0;--ac:#d9788b;--on:#1f3a6b;--tx:#1f3a6b;--ok:#2a8a5e;--bad:#c4506a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 'Noto Sans Thai Looped',system-ui,sans-serif}
.w{max-width:720px;margin:0 auto;padding:12px 12px 150px;animation:fu .55s 1s both}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:22px}
.br{display:flex;align-items:center;gap:16px;min-width:0}
h1{font-size:20px;margin:0;font-weight:700;color:var(--tx);line-height:1.2}
h2{font-size:16px;margin:0 0 8px;font-weight:700;display:flex;gap:6px;align-items:center}
.bub{box-shadow:0 2px 0 rgba(0,0,0,.12);font-size:12px;background:var(--card);color:var(--ink);border-radius:12px 12px 12px 3px;padding:3px 12px;margin-top:9px;display:inline-block}
.cat{flex:none;animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 0 1px rgba(31,58,107,.6)) drop-shadow(0 2px 0 rgba(0,0,0,.12))}
@keyframes bob{50%{transform:translateY(-3px) rotate(-3deg)}}
.ey{transform-box:fill-box;transform-origin:center;animation:bl 4.5s infinite}
@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.nv{display:flex;gap:6px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.nb{background:var(--card);border:0;color:var(--ink);border-radius:12px;padding:7px 9px;display:inline-flex;align-items:center;gap:4px;font-size:13px}
.seg{display:flex;background:rgba(0,0,0,.18);border-radius:14px;padding:3px;margin:0 0 12px}
.seg button{flex:1;border:0;background:none;color:var(--tx);border-radius:11px;padding:6px;font-weight:500}
.seg button.on{background:var(--card);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dw{text-align:center;color:var(--tx);font-size:12px;opacity:.85}
.day{min-height:80px;box-shadow:0 3px 0 rgba(0,0,0,.1);background:var(--card);border:2px solid transparent;border-radius:14px;padding:3px;display:flex;flex-direction:column;gap:2px;color:var(--ink);font-size:12px;text-align:left;overflow:hidden;transition:transform .15s}
.day:active{transform:scale(.94)}
.day .n{width:22px;height:22px;display:grid;place-items:center;border-radius:50%;font-weight:500;align-self:center}
.day.today .n{background:var(--ac);color:var(--on);font-weight:700}
.day.sel{border-color:var(--ac)}.day.today{background:var(--in)}
.eb{display:flex;align-items:center;gap:3px;border-radius:7px;padding:1px 4px;font-size:10px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.eb.big{font-size:13px;padding:4px 9px;border-radius:10px;margin:3px 0}
.day small{text-align:center;color:var(--mut);font-size:10px}
.mi{margin-top:auto;align-self:center;display:flex}
.wd{background:var(--card);box-shadow:0 3px 0 rgba(0,0,0,.1);border-radius:18px;padding:8px 12px;margin-bottom:10px;display:flex;gap:12px;cursor:pointer;border:2px solid transparent}
.wd.today{border-color:var(--ac)}
.wh{width:44px;text-align:center;flex:none}.wh b{display:block;font-size:12px;color:var(--mut)}.wh span{font-size:20px;font-weight:700}
.wb{flex:1;min-width:0}
.ad{background:var(--card);border-radius:16px;padding:6px 10px;margin-bottom:8px}
.tl{position:relative;background:var(--card);border-radius:18px;overflow:hidden}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line);height:52px}
.hr small{position:absolute;left:8px;top:2px;color:var(--mut);font-size:11px}
.tb{position:absolute;border-radius:12px;padding:3px 8px;font-size:12px;overflow:hidden;display:flex;gap:4px;align-items:flex-start;box-shadow:0 2px 0 rgba(0,0,0,.12)}
.tb span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tb svg{flex:none}
.nl{position:absolute;left:44px;right:0;border-top:2px solid var(--bad)}
.card{background:var(--card);border-radius:22px;padding:14px;margin-bottom:12px;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.sums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.sc{background:var(--card);border-radius:16px;padding:8px 10px;min-width:0;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.sc small{display:block;color:var(--mut)}.sc b{font-size:16px;overflow-wrap:anywhere}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}
.chip{border:1px solid var(--line);background:var(--in);color:var(--ink);border-radius:999px;padding:6px 11px;display:inline-flex;gap:5px;align-items:center;font-size:13px}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0;position:relative;display:inline-block}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--card) inset}
.sw.add{display:grid;place-items:center;border:2px dashed var(--mut);color:var(--mut);overflow:hidden}
.sw.add input{position:absolute;inset:-8px;opacity:0;cursor:pointer;width:50px;height:50px;padding:0}
.x{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;border:0;background:var(--ink);color:var(--card);display:grid;place-items:center;padding:0}
input,textarea{font:inherit;color:var(--ink);background:var(--in);border:1px solid var(--line);border-radius:12px;padding:9px 10px;width:100%;min-width:0}
.f{display:flex;gap:8px;margin:8px 0}
.f2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}.f2 label{min-width:0}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;height:44px;text-align:left}
.f2 small{display:block;color:var(--mut);font-size:12px}
.cl{display:grid;gap:4px;font-size:13px;justify-items:center}.cl input{-webkit-appearance:none;appearance:none;width:52px;height:52px;padding:0;border:0;background:none;border-radius:50%}
.cl input::-webkit-color-swatch-wrapper{padding:0}.cl input::-webkit-color-swatch{border:4px solid var(--in);box-shadow:0 0 0 2px var(--line);border-radius:50%}.cl input::-moz-color-swatch{border:4px solid var(--in);border-radius:50%}
.cb{width:36px;height:36px;border-radius:13px;display:grid;place-items:center;flex:none;box-shadow:0 2px 0 rgba(0,0,0,.12)}.sh .sc{background:var(--in);box-shadow:none;border:1px solid var(--line)}
.pv{width:18px;height:18px;border-radius:50%;display:inline-block;border:2px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.btn{background:var(--ac);color:var(--on);border:0;border-radius:14px;padding:9px 14px;display:inline-flex;gap:6px;align-items:center;font-weight:700}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row small,.em{color:var(--mut)}
.bar{width:4px;align-self:stretch;border-radius:2px}
.ib{background:none;border:0;color:var(--mut);padding:6px;display:grid;place-items:center;border-radius:8px}
.ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--mut);background:none;display:grid;place-items:center;color:#fff;padding:0;flex:none}
.ck.on{background:var(--ok);border-color:var(--ok);animation:pop .3s}
.faces{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.face{background:var(--in);border:2px solid var(--line);border-radius:16px;padding:8px 2px;display:grid;justify-items:center;font-size:11px}
.face small{color:var(--mut)}.face.on{border-color:currentColor;animation:pop .35s}
.tot{display:flex;gap:14px;font-size:13px;color:var(--mut)}
.pgb{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}.pgb b{display:block;height:100%;background:var(--ok);border-radius:6px}
.ms{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.dwl{text-align:center;color:var(--mut);font-size:11px;padding-bottom:2px}.mc{display:grid;justify-items:center;background:var(--in);border-radius:12px;padding:4px 0}
.mc i{width:6px;height:6px;border-radius:50%;background:var(--line);margin:8px 0}.mc small{font-size:10px;color:var(--mut)}
nav{position:fixed;left:50%;transform:translateX(-50%);animation:ns .55s 1.1s cubic-bezier(.3,1.3,.5,1) both;width:calc(100% - 24px);max-width:696px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:6px;background:var(--card);border-radius:28px;padding:7px;box-shadow:0 6px 20px rgba(0,0,0,.25),0 3px 0 rgba(0,0,0,.08);z-index:10}
nav button{flex:1;max-width:160px;border:0;background:none;color:var(--mut);display:grid;justify-items:center;font-size:12px;padding:6px;border-radius:22px}
nav button.on{background:var(--ac);color:var(--on);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:var(--on);display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.2);z-index:11;animation:pop .5s 1.3s cubic-bezier(.3,1.6,.5,1) both}
.fab:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.2)}
@keyframes pop{from{transform:scale(0)}}
.sheet{position:fixed;inset:0;background:rgba(15,25,55,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sh{background:var(--card);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sh-h{display:flex;justify-content:space-between;align-items:center}
.sh::before{content:'';display:block;width:42px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 12px}
.sh .chip{padding:6px 9px;gap:4px;font-size:12.5px}
.cf{position:fixed;left:50%;top:60%;width:9px;height:9px;border-radius:3px;z-index:50;pointer-events:none;animation:cf 1s ease-out forwards}
@keyframes cf{to{transform:translate(var(--x),calc(var(--y) + 220px)) rotate(var(--r));opacity:0}}
.slip{position:relative;background:#fff;color:#2a2a35;margin:22px 4px 26px;padding:18px 16px 22px;box-shadow:0 5px 0 rgba(0,0,0,.14);font-size:14px}
.slip::before,.slip::after{content:'';position:absolute;left:0;right:0;height:8px;background-size:16px 100%}
.slip::before{top:-8px;background-image:conic-gradient(from 135deg at top,#0000,#fff 1deg 89deg,#0000 90deg)}
.slip::after{bottom:-8px;background-image:conic-gradient(from -45deg at bottom,#0000,#fff 1deg 89deg,#0000 90deg)}
.stt{display:grid;justify-items:center;gap:2px;text-align:center;font-weight:700;font-size:16px}.stt small{color:#7a7a8a;font-weight:400}
.ds{border:0;border-top:2px dashed #cfcfda;margin:12px 0}
.ln{display:flex;justify-content:space-between;gap:10px;padding:2px 0;font-variant-numeric:tabular-nums}.ln span{min-width:0;overflow-wrap:anywhere}.ln.h{font-weight:700;margin-top:6px}.ln.sub{font-size:12px;color:#7a7a8a;padding-left:12px}
.ln.tt{font-size:20px;font-weight:700;margin-top:4px}
.bc{height:36px;margin:6px 24px;background:repeating-linear-gradient(90deg,#2a2a35 0 2px,#0000 2px 4px,#2a2a35 4px 5px,#0000 5px 8px,#2a2a35 8px 11px,#0000 11px 13px)}
.ft{text-align:center;color:#7a7a8a;font-size:12px;display:flex;gap:4px;justify-content:center;align-items:center}
.stamp{position:absolute;right:12px;top:12px;transform:rotate(-12deg);border:3px solid;border-radius:10px;padding:0 10px;font-weight:700;opacity:.85;font-size:16px}
html{overscroll-behavior:none;-webkit-text-size-adjust:100%}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{-webkit-user-select:none;user-select:none}input,textarea{-webkit-user-select:text;user-select:text}
.chip,.btn,.nb,nav button{transition:transform .12s}.chip:active,.btn:active,.nb:active,nav button:active{transform:scale(.93)}
@keyframes fu{from{opacity:0;transform:translateY(12px)}}
@keyframes ns{from{transform:translate(-50%,130%)}to{transform:translate(-50%,0)}}
@keyframes ld{from{transform:scaleX(0)}}
@keyframes sp{from{transform:scale(0) rotate(-25deg)}}
.pg{animation:fu .3s ease-out}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-content:center;justify-items:center;gap:16px;transition:opacity .5s,transform .5s}
#splash.out{opacity:0;transform:scale(1.1);pointer-events:none}
#spc{background:var(--ac);border-radius:30px;padding:16px;box-shadow:0 8px 0 rgba(0,0,0,.18);display:grid}
.wm{display:block;color:var(--tx);opacity:.8;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
#spc svg{animation:sp .9s cubic-bezier(.3,1.5,.5,1) both,bob 3s 1s ease-in-out infinite}
.spt{color:var(--tx);font-weight:700;font-size:24px;animation:fu .6s .3s both}
.spb{width:120px;height:6px;border-radius:3px;background:rgba(127,127,127,.3);overflow:hidden;animation:fu .5s .45s both}
.spb i{display:block;height:100%;background:var(--ac);border-radius:3px;transform-origin:left;animation:ld 1.1s .3s ease-out both}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 16px;border-radius:999px;z-index:60;animation:fu .25s}
#pm{align-items:center;z-index:30}
.pmb{background:var(--card);width:min(92vw,420px);max-height:92vh;overflow:auto;border-radius:24px;padding:14px;text-align:center;animation:pop .3s cubic-bezier(.3,1.4,.5,1)}
.pmb img{display:block;max-width:100%;max-height:62vh;margin:0 auto 12px;border-radius:14px}
.wtr{display:flex;align-items:center;gap:8px;color:#4f86ee;margin-bottom:4px}.wtr b{color:var(--ink);font-size:30px;line-height:1}.wtr span{color:var(--mut);font-size:14px}
.garden{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.plot{position:relative;border:2px solid transparent;border-radius:18px;background:linear-gradient(#bfe3ff,#eaf7ff);overflow:hidden;padding:4px 0 22px;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.plot.on{border-color:var(--ac)}
.plot svg{display:block;width:100%;height:auto;transform-origin:50% 92%;animation:sway 3.4s ease-in-out infinite}
.plot.grew svg{animation:grow .5s cubic-bezier(.3,1.5,.5,1)}
.pl{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);max-width:94%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;font-size:10.5px;font-weight:700;color:#fff;background:rgba(31,58,107,.62);padding:1px 9px;border-radius:999px}
.empty{position:absolute;left:0;right:0;top:20%;display:grid;place-items:center;color:#fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.dp{position:absolute;top:-10px;width:6px;height:10px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#4f86ee;animation:fall .6s ease-in both;pointer-events:none}
.th{width:44px;flex:none}
@keyframes sway{50%{transform:rotate(2.5deg)}}@keyframes grow{from{transform:scale(.7)}}@keyframes fall{to{transform:translateY(120px);opacity:0}}
.garden{position:relative}
.plot.lock{opacity:.5;filter:grayscale(.6);pointer-events:none}
.bfl{position:absolute;left:0;top:0;border:0;background:none;padding:6px;z-index:5;animation:bfly 8.5s ease-in-out both}
.bfl svg{display:block}
.bfl .wl,.bfl .wr{transform-box:view-box;transform-origin:14px 12px;animation:fl .2s ease-in-out infinite alternate}
@keyframes fl{to{transform:scaleX(.3)}}
@keyframes bfly{0%{transform:translate(var(--sx),var(--sy))}38%{transform:translate(var(--tx),var(--ty))}72%{transform:translate(calc(var(--tx) + 6px),calc(var(--ty) - 6px))}100%{transform:translate(var(--ex),var(--ey))}}
.ledge{position:relative;height:60px;overflow:hidden;margin-top:6px}
.grass{position:absolute;left:-4px;right:-4px;bottom:0;height:16px;background:#7fcf9a;border-radius:10px 10px 0 0;box-shadow:0 -4px 0 #9bdcae;z-index:2}
.gcat{position:absolute;bottom:6px;left:var(--cl,70%);background:none;border:0;padding:0;transform:translateY(120%);animation:peek 14s ease-in-out infinite;z-index:1}
.gcat svg{display:block;width:54px;height:54px}
@keyframes peek{0%,8%{transform:translateY(120%)}18%,60%{transform:translateY(0)}70%,100%{transform:translateY(120%)}}
.s-sum{--sk1:#ffe1a3;--sk2:#fff6dc}.s-rain{--sk1:#aebfd9;--sk2:#e0e8f4}.s-cool{--sk1:#d3dcff;--sk2:#f4f1ff}
.plot{background:linear-gradient(var(--sk1,#bfe3ff),var(--sk2,#eaf7ff))}
.amb{position:absolute;inset:0;pointer-events:none;z-index:3;border-radius:18px}
.s-sum .amb{background:radial-gradient(circle at 94% 4%,rgba(255,206,84,.85) 0 12px,rgba(255,206,84,.3) 13px 30px,transparent 32px);animation:sun 3s ease-in-out infinite alternate}
.s-rain .amb{background:repeating-linear-gradient(105deg,transparent 0 13px,rgba(79,134,238,.38) 13px 14px);animation:rn .45s linear infinite}
.s-cool .amb{background-image:radial-gradient(circle,rgba(255,255,255,.95) 0 2px,transparent 3px),radial-gradient(circle,rgba(247,170,196,.9) 0 2px,transparent 3px);background-size:46px 52px,70px 64px;background-position:0 0,20px 30px;animation:pt 9s linear infinite}
@keyframes sun{from{opacity:.65}}@keyframes rn{to{background-position:-12px 26px}}@keyframes pt{to{background-position:-30px 52px,-10px 94px}}
.ledge{height:100px;border-radius:18px;background:linear-gradient(var(--sk1,#bfe3ff),var(--sk2,#eaf7ff))}
.di{position:absolute;bottom:12px;z-index:1}.di svg{display:block}
.fence{position:absolute;left:0;right:0;bottom:14px;height:26px;z-index:0;background:repeating-linear-gradient(90deg,#f3dfbd 0 9px,#0000 9px 13px);border-radius:4px 4px 0 0}
.fence::before{content:'';position:absolute;left:0;right:0;top:7px;height:4px;background:#d9bf94}
.pond{position:absolute;bottom:10px;width:110px;height:40px;background:none;border:0;padding:0;z-index:1}.pond svg{display:block}
.fish{position:absolute;left:12px;animation:swim 5s ease-in-out infinite}
@keyframes swim{0%{transform:translateX(0) scaleX(1)}48%{transform:translateX(64px) scaleX(1)}52%{transform:translateX(64px) scaleX(-1)}98%{transform:translateX(0) scaleX(-1)}100%{transform:translateX(0) scaleX(1)}}
.bl{transform-box:view-box;transform-origin:22px 30px;animation:spin 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.glow{animation:gl 2.4s ease-in-out infinite alternate}@keyframes gl{to{opacity:.55}}
.shp{width:54px;height:46px;display:grid;place-items:center;flex:none}.shp svg{max-width:54px;max-height:46px;height:auto}
.btn.dim{opacity:.55}
.ledge{height:112px}
.hill{position:absolute;left:-10%;right:-10%;bottom:8px;height:36px;background:#a8e2bb;border-radius:50% 50% 0 0;z-index:0}
.di.b{bottom:30px;z-index:0}.di.s{bottom:auto;top:4px;z-index:0}.di.br{bottom:18px;z-index:2;pointer-events:none}
.hop{animation:hp 2.6s ease-in-out infinite}@keyframes hp{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-8px)}}
.fk{transform-box:fill-box;transform-origin:50% 100%;animation:fk .5s ease-in-out infinite alternate}@keyframes fk{to{transform:scale(.88,1.1)}}
.ks{transform-origin:50% 0;animation:ks 3s ease-in-out infinite alternate}@keyframes ks{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.flt{animation:flt 3s ease-in-out infinite alternate}@keyframes flt{from{transform:translateY(5px)}to{transform:translateY(-6px)}}
.eb.hol{background:rgba(196,80,106,.16);color:var(--bad);box-shadow:inset 0 0 0 1px rgba(196,80,106,.35)}
